[package]
name = "glinet-router"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
dirs = "7.0.0"
indicatif = "0.18"
octocrab = { version = "0.54.9", default-features = false, features = [
  "default-client",
  "rustls",
  "rustls-ring",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
] }
termenu = "2.3.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
serde_json = "1"
